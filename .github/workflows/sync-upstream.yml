name: Sync Upstream

on:
  schedule:
    - cron: '0 16 * * *'  # UTC 16:00 = 北京时间 00:00
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Sync upstream content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 https://github.com/SukkaW/Surge.git /tmp/upstream

          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/upstream/ .

          git add -A
          git diff --cached --quiet || git commit -m "sync: upstream SukkaW/Surge $(date +%Y-%m-%d)"
          git push
